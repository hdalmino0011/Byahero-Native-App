name: Build BYAHERO Android APK & Deploy Web App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "byahero-ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-web:
    name: Build & Deploy Web App to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production web bundle
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

  build-apk:
    name: Assemble Native Kotlin + C++ APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platforms;android-35
            build-tools;35.0.0
            ndk;27.0.12077973
            cmake;3.22.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configure local secrets for build
        working-directory: android
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          echo "MAPS_API_KEY=${MAPS_API_KEY:-AIzaSyPlaceholderForCIBuild}" >> local.properties
          echo "SUPABASE_URL=${SUPABASE_URL:-https://your-project.supabase.co}" >> local.properties
          echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-your-anon-key}" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID:-your-google-client-id}" >> local.properties

      - name: Build Debug APK (Kotlin + C++ NDK)
        working-directory: android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload BYAHERO Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: byahero-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
